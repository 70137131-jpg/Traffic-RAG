<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficBot — Ask the code</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app">
        <header class="lane-header">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-name">TrafficBot</span>
                <span class="brand-sub">Neo-Veridia code</span>
            </div>
            <div class="header-actions">
                <button id="recent-btn" class="h-btn" type="button">Recent</button>
                <button id="doc-btn" class="doc-btn" type="button" title="Load a different document">
                    <span class="dot"></span>
                    <span class="doc-name" id="doc-name">traffic_laws.md</span>
                </button>
                <span class="online" id="online">
                    <span class="dot"></span><span>Online</span>
                </span>
            </div>
        </header>

        <div class="lane-hist" id="hist-panel" hidden>
            <div class="hist-title">Recent questions</div>
            <div class="hist-list" id="hist-list"></div>
        </div>

        <div class="lane-body" id="body">
            <div class="lane-empty" id="empty">
                <div class="lane-stripe"></div>
                <h1 class="hero">ASK THE CODE.</h1>
                <p class="hero-sub">Every answer comes back with the clause it came from. Nothing is quoted that isn't in the book.</p>
                <div class="chips" id="chips"></div>
            </div>
            <div class="thread" id="thread"></div>
        </div>

        <footer class="lane-footer">
            <div class="composer">
                <input id="input" type="text" placeholder="Ask the code…" autocomplete="off">
                <button id="send-btn" class="send-btn" type="button" aria-label="Send">→</button>
            </div>
            <p class="disclaimer">Verify against the official city code before citing</p>
        </footer>
    </div>

    <input type="file" id="file-input" accept=".md,.txt" style="display:none">

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
